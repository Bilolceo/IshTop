name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # GitHub Actions is deprecating Node.js 20 runtime for JavaScript actions.
  # Opt in early so checkout/setup/upload actions run on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ===========================================================================
  # BACKEND TESTS
  # ===========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run pytest
        working-directory: ./backend
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=50
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: ci-jwt-secret-key-0123456789abcdef0123456789
          SECRET_KEY: ci-app-secret-key-0123456789abcdef0123456789
          # Ensure rate limiting is enabled in CI so brute-force protection tests
          # validate the intended behavior regardless of DEBUG defaults.
          RATE_LIMIT_ENABLED: "true"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ===========================================================================
  # BACKEND LINTING
  # ===========================================================================
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run flake8
        working-directory: ./backend
        run: flake8 app tests --max-line-length=120 --extend-ignore=E203,W503 || true
      
      - name: Run black (check)
        working-directory: ./backend
        run: black --check app tests || true
      
      - name: Run isort (check)
        working-directory: ./backend
        run: isort --check-only app tests || true

  # ===========================================================================
  # SECRET SCAN (gitleaks)
  # ===========================================================================
  # Fails the build if a tracked file matches any gitleaks rule. Runs without
  # GITLEAKS_LICENSE (free for public repos / open-source orgs); add a license
  # secret named GITLEAKS_LICENSE to use the action on private orgs.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action calls /repos/.../pulls/{n}/commits to scan only the PR
    # commit range. Default GITHUB_TOKEN cannot read PR contents/commits
    # without explicit permissions.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't upload SARIF — the action fails the whole job if the
          # account has hit its artifact-storage quota, even when 0 leaks
          # are found. The console output already lists every finding.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Don't post a PR comment summary either (requires extra perms
          # we deliberately don't grant — see permissions block).
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ===========================================================================
  # FRONTEND TESTS
  # ===========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run TypeScript check
        working-directory: ./frontend
        run: npm run type-check
        continue-on-error: true

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
      
      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          # Frontend code expects API base to include "/api/v1".
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1

  # ===========================================================================
  # E2E TESTS
  # ===========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ishtop_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Start backend server
        working-directory: ./backend
        run: |
          alembic upgrade head
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level debug > backend-uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/readyz > /dev/null
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ishtop_test
          JWT_SECRET_KEY: ci-e2e-jwt-secret-0123456789abcdef0123456789
          SECRET_KEY: ci-e2e-app-secret-0123456789abcdef0123456789
          EMAIL_TRANSPORT: "disabled"
          OAUTH_ENABLED: "false"
          # Keep debug mode for richer logs in CI; schema is created by Alembic above.
          SMARTCAREER_DEBUG: "true"
          # E2E hits auth endpoints many times across projects (chromium/firefox/webkit/mobile).
          # Disable rate limiting in CI to avoid flaky lockouts.
          RATE_LIMIT_ENABLED: "false"
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          # Frontend code expects API base to include "/api/v1".
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          # Used by Playwright global-setup seeding (admin account).
          DATABASE_URL: postgresql://test:test@localhost:5432/ishtop_test
          # global-setup.ts spawns a fresh python3 that imports app.config to
          # seed the admin row. That subprocess does NOT have pytest loaded,
          # so the production validator would trip without this override.
          SMARTCAREER_DEBUG: "true"
          SKIP_PROD_VALIDATOR: "1"

      - name: Dump backend logs (on failure)
        if: failure()
        working-directory: ./backend
        run: |
          echo "=== backend-uvicorn.log (last 400 lines) ==="
          tail -n 400 backend-uvicorn.log || true

      - name: Upload backend logs
        uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with:
          name: backend-logs
          path: backend/backend-uvicorn.log
          retention-days: 3
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 3

  # ===========================================================================
  # SECURITY SCAN
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ===========================================================================
  # BUILD CHECK
  # ===========================================================================
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ishtop-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ishtop-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://127.0.0.1:8000

  # ===========================================================================
  # DEPLOYMENT — Railway (main branch only, all checks must pass)
  # ===========================================================================
  # Prerequisites (add these in GitHub → Settings → Secrets → Actions):
  #   RAILWAY_TOKEN          — Railway API token (railway.app → Account → Tokens)
  #   RAILWAY_BACKEND_SERVICE_ID  — Service ID for backend  (Railway dashboard → Service → Settings)
  #   RAILWAY_FRONTEND_SERVICE_ID — Service ID for frontend (Railway dashboard → Service → Settings)
  #   RAILWAY_PROJECT_ID     — Project ID (Railway dashboard → Project → Settings)
  # ===========================================================================
  deploy:
    name: Deploy to Production (Railway)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Trigger backend deploy on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE_ID" ]; then
            echo "RAILWAY_TOKEN or RAILWAY_BACKEND_SERVICE_ID not set — skipping."
            exit 0
          fi
          echo "Triggering backend deploy on Railway..."
          RESPONSE=$(curl -s --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceRedeploy(environmentId: null, serviceId: \\\"$SERVICE_ID\\\") }\", \"variables\": {}}" \
            https://backboard.railway.app/graphql/v2)
          echo "Response: $RESPONSE"
          echo "Backend deploy triggered successfully."

      - name: Trigger frontend deploy on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE_ID" ]; then
            echo "RAILWAY_TOKEN or RAILWAY_FRONTEND_SERVICE_ID not set — skipping."
            exit 0
          fi
          echo "Triggering frontend deploy on Railway..."
          RESPONSE=$(curl -s --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceRedeploy(environmentId: null, serviceId: \\\"$SERVICE_ID\\\") }\", \"variables\": {}}" \
            https://backboard.railway.app/graphql/v2)
          echo "Response: $RESPONSE"
          echo "Frontend deploy triggered successfully."

      - name: Deploy summary
        run: |
          echo "## Railway Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor: https://railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
